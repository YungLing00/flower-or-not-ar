<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>花非花？｜Marker AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
html,body{margin:0;overflow:hidden;font-family:system-ui;background:#000}.ui{position:fixed;z-index:10;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;pointer-events:none}.ui a,.ui span{pointer-events:auto;color:#fff;text-decoration:none;background:rgba(5,18,15,.72);border:1px solid rgba(120,255,210,.25);padding:10px 13px;border-radius:999px;backdrop-filter:blur(12px);font-size:12px}.guide{position:fixed;z-index:10;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(5,18,15,.75);padding:11px 15px;border-radius:999px;font-size:11px;white-space:nowrap}
</style>
</head>
<body>
<div class="ui"><a href="ar.html">← 返回互動 AR</a><span>HIRO MARKER MODE</span></div>
<div class="guide">將鏡頭對準 Hiro marker，植物會出現在標記上</div>
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" renderer="antialias: true; alpha: true">
  <a-marker preset="hiro">
    <a-entity position="0 0 0" rotation="0 0 0">
      <a-cylinder position="0 .16 0" radius=".32" height=".32" color="#9c303c"></a-cylinder>
      <a-cylinder position="0 .72 0" radius=".055" height="1.05" color="#44C767"></a-cylinder>
      <a-sphere position="0 1.28 0" radius=".24" color="#e61f4d"></a-sphere>
      <a-sphere position=".20 1.22 0" radius=".18" color="#ff4e67"></a-sphere>
      <a-sphere position="-.20 1.22 0" radius=".18" color="#ff4e67"></a-sphere>
      <a-sphere position="0 1.22 .20" radius=".18" color="#ff4e67"></a-sphere>
      <a-sphere position="0 1.22 -.20" radius=".18" color="#ff4e67"></a-sphere>
      <a-sphere position="0 1.28 0" radius=".085" color="#72f0c3"></a-sphere>
      <a-sphere position="-.24 .83 0" radius=".20" scale="1.3 .45 .25" color="#00AEEF"></a-sphere>
      <a-sphere position=".24 .72 0" radius=".20" scale="1.3 .45 .25" color="#44C767"></a-sphere>
      <a-animation attribute="rotation" dur="7000" to="0 360 0" repeat="indefinite" easing="linear"></a-animation>
    </a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
